name: temp-binance-futures-1s
on:
  push:
    paths:
      - '.github/workflows/temp-binance-futures-1s.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download and aggregate Binance USD-M aggTrades
        shell: bash
        run: |
          python - <<'PYCODE'
          import csv, gzip, hashlib, io, json, math, os, urllib.request, zipfile
          from array import array
          from datetime import date, timedelta

          START_MS=1789125439000
          END_MS=1789607099000
          ASSETS=['BTC','ETH','SOL']
          BASE='https://data.binance.vision/data/futures/um/daily/aggTrades'
          OUT='binance_futures_1s.csv.gz'
          MAN='binance_futures_1s_manifest.json'

          sec0=(START_MS//1000)*1000
          sec1=(END_MS//1000)*1000
          n=(sec1-sec0)//1000+1

          def dates():
              d=date(2026,9,11)
              e=date(2026,9,17)
              while d<=e:
                  yield d.isoformat(); d+=timedelta(days=1)

          def download(url,path):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=180) as r, open(path,'wb') as f:
                  while True:
                      b=r.read(1024*1024)
                      if not b: break
                      f.write(b)

          manifest={'start_ms':START_MS,'end_ms':END_MS,'source':'Binance Public Data futures/um/daily/aggTrades','assets':{}}
          with gzip.open(OUT,'wt',newline='',encoding='utf-8') as outf:
              w=csv.writer(outf)
              w.writerow(['asset','timestamp_ms','last_price','last_trade_ts_ms','price_age_ms','trade_count'])
              for asset in ASSETS:
                  symbol=asset+'USDT'
                  prices=array('d',[float('nan')])*n
                  trade_ts=array('q',[-1])*n
                  counts=array('i',[0])*n
                  seed_price=float('nan'); seed_ts=-1
                  infos=[]
                  for ds in dates():
                      fn=f'{symbol}-aggTrades-{ds}.zip'
                      url=f'{BASE}/{symbol}/{fn}'
                      c_url=url+'.CHECKSUM'
                      print('download',url,flush=True)
                      download(url,fn)
                      download(c_url,fn+'.CHECKSUM')
                      sha=hashlib.sha256(open(fn,'rb').read()).hexdigest()
                      expected=open(fn+'.CHECKSUM').read().strip().split()[0]
                      if sha.lower()!=expected.lower():
                          raise RuntimeError(f'checksum mismatch {fn}: {sha} != {expected}')
                      rows=0
                      with zipfile.ZipFile(fn) as z:
                          names=[x for x in z.namelist() if x.lower().endswith('.csv')] or z.namelist()
                          with z.open(names[0]) as bf:
                              tf=io.TextIOWrapper(bf,encoding='utf-8',newline='')
                              r=csv.reader(tf)
                              for row in r:
                                  if not row: continue
                                  try:
                                      price=float(row[1]); ts=int(row[5])
                                  except (ValueError,IndexError):
                                      continue
                                  if ts>10**14: ts//=1000
                                  rows+=1
                                  if ts<sec0:
                                      if ts>seed_ts: seed_ts=ts; seed_price=price
                                      continue
                                  if ts>sec1+999: break
                                  i=(ts-sec0)//1000
                                  if 0<=i<n:
                                      prices[i]=price; trade_ts[i]=ts; counts[i]+=1
                      infos.append({'file':fn,'sha256':sha,'rows_read':rows,'bytes':os.path.getsize(fn)})
                      os.remove(fn); os.remove(fn+'.CHECKSUM')
                  lp=seed_price; lt=seed_ts; missing=0; max_age=-1; total_trades=0
                  for i in range(n):
                      t=sec0+i*1000
                      if trade_ts[i]>=0:
                          lp=prices[i]; lt=trade_ts[i]
                      else:
                          prices[i]=lp; trade_ts[i]=lt
                      if lt<0 or not math.isfinite(prices[i]):
                          age=-1; missing+=1
                      else:
                          age=t+999-lt; max_age=max(max_age,age)
                      total_trades+=counts[i]
                      w.writerow([asset,t,format(prices[i],'.12g'),trade_ts[i],age,counts[i]])
                  manifest['assets'][asset]={'symbol':symbol,'files':infos,'rows_1s':n,'seed_trade_ts_ms':seed_ts,'missing_price_seconds':missing,'max_price_age_ms':max_age,'trades_in_range':total_trades}
          with open(MAN,'w') as f: json.dump(manifest,f,indent=2)
          print(json.dumps(manifest,indent=2),flush=True)
          PYCODE
      - name: Upload futures artifact
        uses: actions/upload-artifact@v4
        with:
          name: binance-futures-1s-2026-09-11_17
          path: |
            binance_futures_1s.csv.gz
            binance_futures_1s_manifest.json
          compression-level: 0
          retention-days: 1
